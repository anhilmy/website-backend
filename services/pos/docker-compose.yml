version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: pos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: website_backend
      POSTGRES_USER: backenduser
      POSTGRES_PASSWORD: password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./sql/sample-data.sql:/docker-entrypoint-initdb.d/02-sample-data.sql
    ports:
      - "5432:5432"
    networks:
      - pos_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U backenduser -d website_backend" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # POS Application
  pos-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pos_application
    restart: unless-stopped
    environment:
      - JAVA_OPTS=-Xmx512m -Xms256m
      - DB_DRIVER=org.postgresql.Driver
      - DB_URL=jdbc:postgresql://postgres:5432/website_backend
      - DB_USERNAME=backenduser
      - DB_PASSWORD=password
      - DB_DIALECT=org.hibernate.dialect.PostgreSQLDialect
      - DEVELOPMENT=false
    ports:
      - "4567:4567"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pos_network
    volumes:
      - app_logs:/app/logs
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:4567/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Redis for Caching (Optional)
  redis:
    image: redis:7-alpine
    container_name: pos_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - pos_network
    command: redis-server --appendonly yes --requirepass redispassword
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5

  # Kafka for Logging (Optional)
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: pos_zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - pos_network

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: pos_kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - pos_network

  # pgAdmin for Database Management (Optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pos_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pos.local
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "8080:80"
    depends_on:
      - postgres
    networks:
      - pos_network
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    container_name: pos_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - pos-app
    networks:
      - pos_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  kafka_data:
    driver: local
  pgadmin_data:
    driver: local
  app_logs:
    driver: local

networks:
  pos_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
