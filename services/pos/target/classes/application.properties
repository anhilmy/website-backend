# Application configuration for different environments
# Example for development (SQLite)
db.type=sqlite
db.url=jdbc:sqlite:pos_dev.db
db.username=
db.password=

# Example for production (PostgreSQL)
# db.type=postgresql
# db.url=jdbc:postgresql://localhost:5432/pos_prod
# db.username=postgres
# db.password=yourpassword

# Logging
log.level=INFO
log.file=logs/pos.log
log.show_sql=true

# Kafka
kafka.bootstrap.servers=localhost:9092
kafka.topic.logs=pos-logs

# JWT
jwt.secret=your_jwt_secret_key
jwt.expiration=3600

# Server
server.port=4567
