# Docker Environment Database Configuration
# This file is used when running the application in Docker containers

# PostgreSQL connection for Docker Compose
db.url=jdbc:postgresql://postgres:5432/website_backend
db.user=backenduser
db.password=password

# Connection pool settings for Docker
db.pool.initialSize=5
db.pool.maxActive=20
db.pool.maxIdle=10
db.pool.minIdle=5
db.pool.maxWait=10000

# Hibernate settings for Docker
hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
hibernate.hbm2ddl.auto=validate
hibernate.show_sql=false
hibernate.format_sql=false

# Docker-specific optimizations
hibernate.connection.provider_class=org.hibernate.hikaricp.internal.HikariCPConnectionProvider
hibernate.hikari.connectionTimeout=20000
hibernate.hikari.maximumPoolSize=20
hibernate.hikari.minimumPoolSize=5