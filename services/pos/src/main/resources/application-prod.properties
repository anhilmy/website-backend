# Production profile (PROFILE=prod) - PostgreSQL, conservative logging
db.type=postgresql
db.hbm2ddl=validate
# A real secret MUST be supplied via the JWT_SECRET environment variable.
jwt.secret=@@REQUIRED@@
seed.demo-users=false
log.level=INFO
log.show_sql=false
log.payload.enabled=false
kafka.enabled=true
server.rate-limit.requests-per-minute=300
