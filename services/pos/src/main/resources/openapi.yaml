openapi: 3.0.3
info:
  title: POS System API
  version: 1.0.0
  description: >
    Point of Sale backend. All responses use the envelope
    `{ success, data, message, error, timestamp }`. Authenticate with
    `POST /api/v1/auth/login` and send the returned token as `Authorization: Bearer <token>`.
servers:
  - url: http://localhost:4567
tags:
  - name: Health
  - name: Auth
  - name: Public Menu
  - name: Categories
  - name: Items
  - name: Modifiers
  - name: Orders
  - name: Payment Methods
  - name: Charges
  - name: Reports
  - name: Tables
  - name: Users

paths:
  /api/v1/healthcheck:
    get:
      tags: [Health]
      summary: Liveness probe
      responses:
        '200': { description: OK }
  /api/v1/healthcheck/ready:
    get:
      tags: [Health]
      summary: Readiness probe (checks database connectivity)
      responses:
        '200': { description: Ready }
        '503': { description: Dependency down }
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Authenticate and obtain a JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponseEnvelope'
        '401': { description: Invalid credentials }
        '429': { description: Too many attempts }
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current token
      responses:
        '200': { description: Logged out }
  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Current authenticated user
      responses:
        '200': { description: The current user }
        '401': { description: Unauthenticated }
  /api/v1/menu/categories:
    get:
      tags: [Public Menu]
      summary: List active categories (public)
      security: []
      responses:
        '200': { description: Active categories }
  /api/v1/menu/items:
    get:
      tags: [Public Menu]
      summary: List available items (public)
      security: []
      responses:
        '200':
          description: Available items, each with a derived `hasModifiers` flag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItemListEnvelope'
  /api/v1/menu/items/{id}:
    get:
      tags: [Public Menu]
      summary: Get a menu item (public)
      security: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Menu item, including `hasModifiers`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItemEnvelope'
        '404': { description: Not found }
  /api/v1/menu/items/{id}/modifiers:
    get:
      tags: [Public Menu]
      summary: Active modifier groups and options for an item (public)
      security: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Groups with options
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModifierGroupListEnvelope'
        '404': { description: Not found }
  /api/v1/categories:
    get:
      tags: [Categories]
      summary: List categories
      responses:
        '200': { description: Categories }
    post:
      tags: [Categories]
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '201': { description: Created }
        '400': { description: Validation error }
        '409': { description: Duplicate name }
  /api/v1/categories/{id}:
    get:
      tags: [Categories]
      summary: Get a category
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { description: Category }
        '404': { description: Not found }
    put:
      tags: [Categories]
      summary: Update a category
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '200': { description: Updated }
    delete:
      tags: [Categories]
      summary: Soft-delete (deactivate) a category
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204': { description: Deactivated }
  /api/v1/items:
    get:
      tags: [Items]
      summary: List/filter menu items
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: categoryId, in: query, schema: { type: integer } }
        - { name: available, in: query, schema: { type: boolean } }
        - { name: minPrice, in: query, schema: { type: number } }
        - { name: maxPrice, in: query, schema: { type: number } }
      responses:
        '200': { description: Items }
    post:
      tags: [Items]
      summary: Create a menu item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuItemRequest'
      responses:
        '201': { description: Created }
  /api/v1/items/{id}:
    get:
      tags: [Items]
      summary: Get a menu item
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { description: Item }
    put:
      tags: [Items]
      summary: Update a menu item
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuItemRequest'
      responses:
        '200': { description: Updated }
    delete:
      tags: [Items]
      summary: Soft-delete (deactivate) an item
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204': { description: Deactivated }
  /api/v1/modifier-groups:
    get:
      tags: [Modifiers]
      summary: List modifier groups (manager only)
      parameters:
        - { name: menuItemId, in: query, schema: { type: integer } }
      responses:
        '200':
          description: Groups with options
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModifierGroup'
        '403': { description: Forbidden }
    post:
      tags: [Modifiers]
      summary: Create a modifier group (manager only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModifierGroupRequest'
      responses:
        '201': { description: Created }
        '400': { description: Invalid scope or min/max rules }
        '403': { description: Forbidden }
  /api/v1/modifier-groups/{id}:
    put:
      tags: [Modifiers]
      summary: Update a modifier group (manager only)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModifierGroupRequest'
      responses:
        '200': { description: Updated }
        '400': { description: Invalid min/max rules }
        '403': { description: Forbidden }
        '404': { description: Not found }
    delete:
      tags: [Modifiers]
      summary: Soft-deactivate a modifier group (manager only)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204': { description: Deactivated }
        '403': { description: Forbidden }
        '404': { description: Not found }
  /api/v1/modifier-groups/{groupId}/options:
    post:
      tags: [Modifiers]
      summary: Add an option to a group (manager only)
      parameters:
        - { name: groupId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModifierOptionRequest'
      responses:
        '201': { description: Created }
        '403': { description: Forbidden }
        '404': { description: Group not found }
        '409': { description: Group is inactive }
  /api/v1/modifier-options/{id}:
    put:
      tags: [Modifiers]
      summary: Update an option (manager only)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModifierOptionRequest'
      responses:
        '200': { description: Updated }
        '403': { description: Forbidden }
        '404': { description: Not found }
    delete:
      tags: [Modifiers]
      summary: Soft-deactivate an option (manager only)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204': { description: Deactivated }
        '403': { description: Forbidden }
        '404': { description: Not found }
  /api/v1/orders:
    get:
      tags: [Orders]
      summary: List orders
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [DRAFT, IN_PROGRESS, COMPLETED, CANCELLED, PARTIALLY_REFUNDED, REFUNDED, AMENDED] } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: page, in: query, schema: { type: integer, default: 1, minimum: 1 } }
        - { name: size, in: query, schema: { type: integer, default: 20, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Paged orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPageEnvelope'
    post:
      tags: [Orders]
      summary: Create a draft order
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
      responses:
        '201':
          description: Draft created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderEnvelope'
  /api/v1/orders/{id}:
    get:
      tags: [Orders]
      summary: Get an order with items
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Order with line modifiers and notes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderEnvelope'
        '404': { description: Not found }
  /api/v1/orders/{id}/items:
    post:
      tags: [Orders]
      summary: Add an item to a draft order
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderItemRequest'
      responses:
        '200':
          description: Updated order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderEnvelope'
        '400': { description: Unknown option, duplicate ids, or an invalid note/quantity }
        '409': { description: Order not a draft, item unavailable, or required options missing }
  /api/v1/orders/{id}/items/{itemId}:
    put:
      tags: [Orders]
      summary: Update a draft line (quantity, options or note)
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - { name: itemId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderItemRequest'
      responses:
        '200':
          description: Updated order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderEnvelope'
        '400': { description: Unknown option, duplicate ids, or invalid note/quantity }
        '409': { description: Order not a draft, required options missing, or duplicate line identity }
    delete:
      tags: [Orders]
      summary: Remove an item from a draft order
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - { name: itemId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Updated order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderEnvelope'
  /api/v1/orders/{id}/complete:
    post:
      tags: [Orders]
      summary: Complete an order with payment
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteOrderRequest'
      responses:
        '200':
          description: Completed order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderEnvelope'
        '409': { description: Empty order or insufficient payment }
  /api/v1/orders/{id}/cancel:
    post:
      tags: [Orders]
      summary: Cancel an order
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Cancelled order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderEnvelope'
        '409': { description: Order cannot be cancelled }
  /api/v1/orders/{id}/items/{itemId}/void:
    post:
      tags: [Orders]
      summary: Void a draft line (keeps it on the bill for audit)
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - { name: itemId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoidItemRequest'
      responses:
        '200':
          description: Updated order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderEnvelope'
        '409': { description: Line already voided or order not draft }
  /api/v1/orders/{id}/refunds:
    post:
      tags: [Orders]
      summary: Refund a settled line (manager only)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundRequest'
      responses:
        '200':
          description: Updated order with refunds (option pricing included in the line total)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderEnvelope'
        '403': { description: Forbidden }
        '409': { description: Quantity/status invalid }
  /api/v1/orders/{id}/amend:
    post:
      tags: [Orders]
      summary: Re-open a cancelled bill as a linked draft
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '201':
          description: New draft bill with copied modifier snapshots and notes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderEnvelope'
        '409': { description: Bill is not cancelled or already amended }
  /api/v1/reports/payments:
    get:
      tags: [Reports]
      summary: Reconciled totals by payment method (manager only)
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200': { description: Payment report }
        '403': { description: Forbidden }
  /api/v1/orders/export:
    get:
      tags: [Reports]
      summary: Bill-level CSV export (manager only)
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: status, in: query, schema: { type: string } }
        - { name: format, in: query, schema: { type: string, enum: [csv] } }
      responses:
        '200':
          description: CSV attachment
          content:
            text/csv:
              schema: { type: string }
        '403': { description: Forbidden }
  /api/v1/payment-methods:
    get:
      tags: [Payment Methods]
      summary: List payment methods (public; use active=true for the till)
      security: []
      parameters:
        - { name: active, in: query, schema: { type: boolean } }
      responses:
        '200': { description: Payment methods }
    post:
      tags: [Payment Methods]
      summary: Create a payment method (manager only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentMethodRequest'
      responses:
        '201': { description: Created }
        '403': { description: Forbidden }
        '409': { description: Code already exists }
  /api/v1/payment-methods/{id}:
    put:
      tags: [Payment Methods]
      summary: Update a payment method (manager only)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentMethodRequest'
      responses:
        '200': { description: Updated }
        '403': { description: Forbidden }
    delete:
      tags: [Payment Methods]
      summary: Deactivate a payment method (manager only)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204': { description: Deactivated }
        '403': { description: Forbidden }
  /api/v1/charge-templates:
    get:
      tags: [Charges]
      summary: List reusable charge templates (public; use active=true for new orders)
      security: []
      parameters:
        - { name: active, in: query, schema: { type: boolean } }
      responses:
        '200': { description: Charge templates }
    post:
      tags: [Charges]
      summary: Create a charge template (manager only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChargeTemplateRequest'
      responses:
        '201': { description: Created }
        '403': { description: Forbidden }
        '409': { description: Code already exists }
  /api/v1/charge-templates/{id}:
    put:
      tags: [Charges]
      summary: Update a charge template (manager only)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChargeTemplateRequest'
      responses:
        '200': { description: Updated }
        '403': { description: Forbidden }
    delete:
      tags: [Charges]
      summary: Deactivate a charge template (manager only)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204': { description: Deactivated }
        '403': { description: Forbidden }
  /api/v1/users:
    get:
      tags: [Users]
      summary: List users (manager only)
      responses:
        '200': { description: Users }
        '403': { description: Forbidden }
    post:
      tags: [Users]
      summary: Create a user (manager only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201': { description: Created }
  /api/v1/users/{id}:
    get:
      tags: [Users]
      summary: Get a user (manager only)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { description: User }

  /api/v1/tables:
    get:
      tags: [Tables]
      summary: List floor tables
      parameters:
        - { name: area, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [AVAILABLE, RESERVED, OCCUPIED, JOINED, CLEANING, OUT_OF_SERVICE] } }
      responses:
        '200': { description: Tables }
    post:
      tags: [Tables]
      summary: Create a table (manager only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TableRequest'
      responses:
        '201': { description: Created }
        '409': { description: Duplicate name }
  /api/v1/tables/{id}:
    get:
      tags: [Tables]
      summary: Get a table
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { description: Table }
    put:
      tags: [Tables]
      summary: Update name/area (manager only)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TableRequest'
      responses:
        '200': { description: Updated }
    delete:
      tags: [Tables]
      summary: Delete a table (manager only; blocked while in use)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204': { description: Deleted }
        '409': { description: Table in use }
  /api/v1/tables/{id}/status:
    patch:
      tags: [Tables]
      summary: Change status (JOINED is rejected; use /join)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TableStatusRequest'
      responses:
        '200': { description: Updated }
        '409': { description: Illegal transition }
  /api/v1/tables/{id}/open:
    post:
      tags: [Tables]
      summary: Open a table (creates and attaches a draft order)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenTableRequest'
      responses:
        '200': { description: Occupied table with a new bill }
        '409': { description: Table not openable }
  /api/v1/tables/{id}/assign:
    post:
      tags: [Tables]
      summary: Seat an existing DRAFT order at the table
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignTableRequest'
      responses:
        '200': { description: Table }
        '403': { description: Not your order }
        '409': { description: Order not seatable }
  /api/v1/tables/{id}/release:
    post:
      tags: [Tables]
      summary: Release the table (cancels the open bill, frees joined tables, marks for cleaning)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { description: Table }
        '409': { description: Table is a joined table }
  /api/v1/tables/{id}/join:
    post:
      tags: [Tables]
      summary: Merge this table into a host table (share one bill)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinTableRequest'
      responses:
        '200': { description: Joined table }
        '400': { description: targetTableId missing }
        '409': { description: Join not allowed }
  /api/v1/tables/{id}/unjoin:
    post:
      tags: [Tables]
      summary: Detach a joined table from its host
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { description: Table }
        '409': { description: Table is not joined }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: integer }
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }
    LoginResponseEnvelope:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: object
          properties:
            token: { type: string }
            tokenType: { type: string }
            expiresIn: { type: integer }
            userId: { type: integer }
            username: { type: string }
            role: { type: string }
    CategoryRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        active: { type: boolean }
        parentId: { type: integer, nullable: true }
    MenuItemRequest:
      type: object
      required: [name, price, categoryId]
      properties:
        name: { type: string }
        description: { type: string }
        price: { type: number, minimum: 0 }
        categoryId: { type: integer }
        available: { type: boolean }
        imageUrl: { type: string }
    OrderRequest:
      type: object
      properties:
        customerInfo: { type: string }
    OrderItemRequest:
      type: object
      required: [menuItemId, quantity]
      properties:
        menuItemId: { type: integer }
        quantity: { type: integer, minimum: 1 }
        modifierOptionIds:
          type: array
          description: 'Selected option ids. Null on PUT leaves the snapshot unchanged; [] clears it.'
          items: { type: integer }
        note: { type: string, maxLength: 255, nullable: true }
    ModifierGroupRequest:
      type: object
      required: [menuItemId, name]
      properties:
        menuItemId: { type: integer }
        name: { type: string, maxLength: 64 }
        selectionType: { type: string, enum: [SINGLE, MULTI] }
        required: { type: boolean }
        minSelect: { type: integer, minimum: 0 }
        maxSelect: { type: integer, minimum: 1 }
        sortOrder: { type: integer }
        active: { type: boolean }
    ModifierOptionRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 64 }
        priceDelta: { type: number, description: 'Per-unit delta; may be negative' }
        isDefault: { type: boolean }
        available: { type: boolean }
        sortOrder: { type: integer }
    ModifierOption:
      type: object
      properties:
        id: { type: integer }
        groupId: { type: integer }
        name: { type: string }
        priceDelta: { type: number }
        isDefault: { type: boolean }
        available: { type: boolean }
        sortOrder: { type: integer }
    ModifierGroup:
      type: object
      properties:
        id: { type: integer }
        menuItemId: { type: integer }
        name: { type: string }
        selectionType: { type: string, enum: [SINGLE, MULTI] }
        required: { type: boolean }
        minSelect: { type: integer }
        maxSelect: { type: integer }
        sortOrder: { type: integer }
        active: { type: boolean }
        options:
          type: array
          items:
            $ref: '#/components/schemas/ModifierOption'
    MenuItem:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string, nullable: true }
        price: { type: number }
        menuCategory:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
        available: { type: boolean }
        imageUrl: { type: string, nullable: true }
        hasModifiers:
          type: boolean
          description: True when the item has at least one active modifier group.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TransactionItemModifier:
      type: object
      description: >
        Snapshot copied onto the order line at order time. Names and the price delta are
        authoritative for that bill even if the menu option is later edited or deleted.
      properties:
        id: { type: integer }
        modifierOptionId: { type: integer, nullable: true }
        groupName: { type: string }
        optionName: { type: string }
        priceDelta: { type: number }
        sortOrder:
          type: integer
          description: Display ordinal, stable for the lifetime of the bill.
        createdAt: { type: string, format: date-time }
    TransactionItem:
      type: object
      properties:
        id: { type: integer }
        menuItem:
          $ref: '#/components/schemas/MenuItem'
        quantity: { type: integer }
        unitPrice:
          type: number
          description: Effective per-unit price including the selected option deltas.
        totalPrice: { type: number }
        note: { type: string, nullable: true, maxLength: 255 }
        modifiers:
          type: array
          items:
            $ref: '#/components/schemas/TransactionItemModifier'
        status: { type: string, enum: [ACTIVE, VOIDED] }
        voidReason: { type: string, nullable: true }
        voidedBy: { type: string, nullable: true }
        voidedAt: { type: string, format: date-time, nullable: true }
    Order:
      type: object
      properties:
        id: { type: integer }
        status:
          type: string
          enum: [DRAFT, IN_PROGRESS, COMPLETED, CANCELLED, PARTIALLY_REFUNDED, REFUNDED, AMENDED]
        subtotalAmount: { type: number }
        chargesAmount: { type: number }
        taxAmount: { type: number }
        totalAmount: { type: number }
        refundedAmount: { type: number }
        paymentMethod: { type: string, nullable: true }
        paymentAmount: { type: number, nullable: true }
        paymentReference: { type: string, nullable: true }
        customerInfo: { type: string, nullable: true }
        items:
          type: array
          items:
            $ref: '#/components/schemas/TransactionItem'
        charges:
          type: array
          items:
            $ref: '#/components/schemas/Charge'
        refunds:
          type: array
          items:
            $ref: '#/components/schemas/Refund'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    MenuItemEnvelope:
      type: object
      properties:
        success: { type: boolean }
        data: { $ref: '#/components/schemas/MenuItem' }
        message: { type: string, nullable: true }
        timestamp: { type: string, format: date-time }
    MenuItemListEnvelope:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: array
          items:
            $ref: '#/components/schemas/MenuItem'
        message: { type: string, nullable: true }
        timestamp: { type: string, format: date-time }
    ModifierGroupListEnvelope:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: array
          items:
            $ref: '#/components/schemas/ModifierGroup'
        message: { type: string, nullable: true }
        timestamp: { type: string, format: date-time }
    OrderEnvelope:
      type: object
      properties:
        success: { type: boolean }
        data: { $ref: '#/components/schemas/Order' }
        message: { type: string, nullable: true }
        timestamp: { type: string, format: date-time }
    OrderPageEnvelope:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Order'
            page: { type: integer }
            size: { type: integer }
            total: { type: integer }
            totalPages: { type: integer }
        message: { type: string, nullable: true }
        timestamp: { type: string, format: date-time }
    CompleteOrderRequest:
      type: object
      required: [paymentMethod, paymentAmount]
      properties:
        paymentMethod:
          type: string
          description: Must be an active payment-method code.
          example: CASH
        paymentAmount: { type: number }
        paymentReference: { type: string, nullable: true }
    PaymentMethodRequest:
      type: object
      required: [code, label]
      properties:
        code: { type: string, pattern: '^[A-Za-z0-9_]{2,32}$' }
        label: { type: string, maxLength: 64 }
        active: { type: boolean }
        isCash: { type: boolean }
        requiresReference: { type: boolean }
        sortOrder: { type: integer }
    PaymentMethod:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        label: { type: string }
        active: { type: boolean }
        isCash: { type: boolean }
        requiresReference: { type: boolean }
        sortOrder: { type: integer }
    ChargeTemplateRequest:
      type: object
      required: [code, label]
      properties:
        code: { type: string, pattern: '^[A-Za-z0-9_]{2,32}$' }
        label: { type: string, maxLength: 64 }
        calcType: { type: string, enum: [PERCENTAGE, FIXED] }
        value:
          type: number
          description: 'PERCENTAGE is a fraction 0-1 (0.10 = 10%); FIXED is an absolute amount'
        basis: { type: string, enum: [SUBTOTAL, RUNNING_TOTAL] }
        sortOrder: { type: integer }
        taxable: { type: boolean, description: 'Feeds later RUNNING_TOTAL bases' }
        isTax: { type: boolean, description: 'Populates the bill taxAmount' }
        active: { type: boolean }
    ChargeTemplate:
      allOf:
        - $ref: '#/components/schemas/ChargeTemplateRequest'
        - type: object
          properties:
            id: { type: integer }
    Charge:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        label: { type: string }
        calcType: { type: string, enum: [PERCENTAGE, FIXED] }
        value: { type: number }
        basis: { type: string, enum: [SUBTOTAL, RUNNING_TOTAL] }
        sortOrder: { type: integer }
        taxable: { type: boolean }
        isTax: { type: boolean }
        computedAmount: { type: number }
    VoidItemRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, maxLength: 255 }
    RefundRequest:
      type: object
      required: [transactionItemId, quantity, reason]
      properties:
        transactionItemId: { type: integer }
        quantity: { type: integer, minimum: 1 }
        reason: { type: string, maxLength: 255 }
        paymentMethod: { type: string, nullable: true }
    Refund:
      type: object
      properties:
        id: { type: integer }
        transactionItemId: { type: integer }
        quantity: { type: integer }
        amount: { type: number }
        reason: { type: string }
        paymentMethod: { type: string }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
    PaymentSummary:
      type: object
      properties:
        method: { type: string }
        count:
          type: integer
          description: Settled bills sold with this method (0 for refund-only rows)
        gross: { type: number }
        refunded: { type: number }
        net: { type: number }
    PaymentReport:
      type: object
      properties:
        from: { type: string, format: date-time, nullable: true }
        to: { type: string, format: date-time, nullable: true }
        rows:
          type: array
          items:
            $ref: '#/components/schemas/PaymentSummary'
        totals:
          $ref: '#/components/schemas/PaymentSummary'
    UserCreateRequest:
      type: object
      required: [username, password, role]
      properties:
        username: { type: string }
        password: { type: string }
        role: { type: string, enum: [MANAGER, CASHIER] }
    TableRequest:
      type: object
      required: [name, area]
      properties:
        name: { type: string, maxLength: 100 }
        area: { type: string, maxLength: 100 }
    TableStatusRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [AVAILABLE, RESERVED, OCCUPIED, CLEANING, OUT_OF_SERVICE] }
    OpenTableRequest:
      type: object
      properties:
        customerInfo: { type: string }
    AssignTableRequest:
      type: object
      required: [transactionId]
      properties:
        transactionId: { type: integer }
    JoinTableRequest:
      type: object
      required: [targetTableId]
      properties:
        targetTableId: { type: integer }
    TableResponse:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        area: { type: string }
        status: { type: string }
        currentTransactionId: { type: integer, nullable: true }
        currentTransactionTotal: { type: number, nullable: true }
        joinedToId: { type: integer, nullable: true }
        joinedToName: { type: string, nullable: true }

security:
  - bearerAuth: []
