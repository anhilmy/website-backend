# Test configuration - overrides src/main/resources/application.properties on the test classpath.
db.type=sqlite
db.url=jdbc:sqlite:target/pos_test.db
db.hbm2ddl=create-drop
log.level=WARN
log.show_sql=false
log.payload.enabled=false
seed.enabled=false

server.port=0
server.rate-limit.requests-per-minute=100000
server.rate-limit.login-attempts-per-minute=100000

jwt.secret=test_secret_key_that_is_long_enough_for_hs256_signing_1234567890
jwt.expiration=3600
jwt.issuer=pos-system

order.tax-rate=0.10
order.max-items=200
kafka.enabled=false
